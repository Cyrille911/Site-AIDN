name: CI/CD - AIDN

on:
  push:
    branches:
      - deploy

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate_tag.outputs.tag }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v2

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate new Docker image tag
        id: generate_tag
        run: |
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          
          # Build avec le .env qui contient les variables NEXT_PUBLIC_*
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/aidn:${{ env.IMAGE_TAG }} -t ${{ secrets.DOCKERHUB_USERNAME }}/aidn:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aidn:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/aidn:latest

  deploy_to_vps:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD}}
          script: |
            cd /home/aidn-web/

            echo "📥 Pulling new Docker image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/aidn:${{ needs.build_and_push.outputs.image_tag }}

            echo "🔄 Updating docker-compose.yml..."
            
            # Mettre à jour le tag de l'image (utiliser le même username que pour le pull)
            sed -i 's|image: .*/aidn:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/aidn:${{ needs.build_and_push.outputs.image_tag }}|' docker-compose.yml
            
            echo "📋 Verifying docker-compose.yml update..."
            head -n 10 docker-compose.yml

            echo "🛑 Stopping existing containers..."
            docker compose rm -fsv web #le nom du service dans le docker-compose.yml

            echo "🚀 Starting updated containers..."
            docker compose up -d --pull=never web

            echo "🚮 Deleting unused old images..."
            docker image prune -f

            echo "✅ Deployment complete! "