services:
  web:
    image: univers10/aidn:1.0.1
    container_name: aidn-web
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  static_volume:
  media_volume:
